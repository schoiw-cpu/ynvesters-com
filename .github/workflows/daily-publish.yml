name: Daily Content Publish

# 자동 발행 일시 중단 (2026-08-15).
# 이유: GSC 기준 72페이지 중 색인 2개, 63개가 "발견됨 - 크롤 안 됨" 상태.
# 병목은 콘텐츠 공급이 아니라 크롤 예산(= 외부 링크 0개)이므로, 글을 더 얹어도
# 대기줄만 늘고 API 비용만 나간다. 외부 링크 확보로 크롤이 살아나는지 확인한 뒤 재개할 것.
# 재개 방법: 아래 schedule 블록의 주석을 해제.
on:
  # schedule:
  #   - cron: '0 6 * * *'     # 06:00 UTC, 매일
  workflow_dispatch:          # 수동 트리거는 계속 가능

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (hero image rendering)
        run: npx playwright install chromium --with-deps

      - name: Run content pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_APPLICATION_ID: ${{ secrets.UNSPLASH_APPLICATION_ID }}
          SITE_URL: https://ynvesters.com
        run: node scripts/orchestrator.mjs

      - name: Check for new content
        id: check
        run: |
          git status --porcelain src/content/posts/ public/images/ | grep -q . && echo "has_changes=true" >> $GITHUB_OUTPUT || true

      # A single bad MDX (e.g. an invented component import) breaks the Astro build.
      # Cloudflare Pages then fails silently and every later post stays unpublished,
      # so verify the build BEFORE committing — never push content that can't deploy.
      - name: Verify build
        if: steps.check.outputs.has_changes == 'true'
        run: npm run build

      - name: Commit and push
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "ynvesters-bot"
          git config user.email "bot@ynvesters.com"
          git add src/content/posts/ public/images/
          git commit -m "post: auto-publish $(date -u '+%Y-%m-%d')"
          git push
