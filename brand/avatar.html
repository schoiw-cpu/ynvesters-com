<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Square profile avatar, rendered at 256px and shot at 2x.
     Matches the hero-card system in brand/hero.html: the same navy gradient
     ground, the same blue-to-amber accent, the same Inter stack. Platforms
     crop this to a circle and show it at ~40px in feeds, so the mark is a
     single letterform with nothing that survives only at full size. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 256px; height: 256px; }
  body {
    display: grid;
    place-items: center;
    background: linear-gradient(150deg, #101f38, #0b1830 55%, #081222);
    font-family: 'Inter', 'Helvetica Neue', -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  /* Faint grid, same motif as the hero cards */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(#ffffff0a 1px, transparent 1px),
      linear-gradient(90deg, #ffffff0a 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* Glow behind the mark so it holds against the dark ground when scaled down */
  .glow {
    position: absolute;
    width: 190px; height: 190px;
    border-radius: 50%;
    background: radial-gradient(circle, #2563eb2e 0%, transparent 68%);
  }

  .mark {
    position: relative;
    font-size: 150px;
    font-weight: 800;
    letter-spacing: -.06em;
    line-height: 1;
    background: linear-gradient(#3b82f6, #fbbf24);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    /* optical centering: the Y's stem reads low without this nudge */
    transform: translateY(-6px);
  }

  /* Arc echoing the "rising" motion in the accent gradient */
  .arc {
    position: absolute;
    width: 196px; height: 196px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #3b82f6;
    border-right-color: #fbbf24;
    opacity: .5;
    transform: rotate(-42deg);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="arc"></div>
  <div class="mark">Y</div>
</body>
</html>
